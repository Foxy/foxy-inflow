name: Release

# Releasing is off while the project is not ready to ship. Nothing runs on its
# own: this workflow only fires when someone starts it from the Actions tab,
# and it dry-runs unless they clear the checkbox. To turn automatic releases
# back on, uncomment the `push` trigger below.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be released without publishing anything"
        type: boolean
        default: true
  # push:
  #   branches:
  #     - main
  #     - beta

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release on GitHub and npm
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
      # semantic-release writes the released version into package.json without
      # committing it. It stays at 0.0.0 when the run produced no release, so
      # this doubles as the "did anything ship?" signal for the CDN job. A
      # dry run skips the step that writes it, so it stays 0.0.0 there too.
      - name: Read the released version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  upload-to-cdn:
    name: Upload to Foxy CDN
    needs: release
    # The version guard alone would already hold on a dry run. Name the dry run
    # anyway — this job uploads to a public CDN, so leave nothing implicit.
    if: ${{ !inputs.dry_run && needs.release.outputs.version != '0.0.0' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:cdn
      - name: Upload to s3cdn
        # Pinned to a SHA, not @main: this is a Docker action and it runs
        # with the CDN bucket credentials below. Current tip of main as of
        # 2026-09-10. Dependabot opens a PR when it moves.
        uses: Foxy/foxy-github-action-s3cdn@9182acd716c328cd1bdfe21804139e30cd7ff85f
        with:
          package-name: inflow
        env:
          # The action reads the version from here, not from the git ref.
          LATEST_TAG_NAME: v${{ needs.release.outputs.version }}
          AWS_S3_CDN_BUCKET_NAME: ${{ secrets.AWS_S3_CDN_BUCKET_NAME }}
          AWS_S3_CDN_KEY_ID: ${{ secrets.AWS_S3_CDN_KEY_ID }}
          AWS_S3_CDN_KEY_SECRET: ${{ secrets.AWS_S3_CDN_KEY_SECRET }}
          SOURCE_DIR: "dist/cdn"
      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_CDN_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_CDN_KEY_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/inflow*"
