name: Release

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be released without publishing anything"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release on GitHub and npm
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is load-bearing, even though a trusted publisher is
          # configured for this package on npmjs.com and id-token: write is
          # granted above. Do not remove it without reading the rest of this.
          #
          # This repository was created after 2026-07-15, so GitHub mints its
          # OIDC tokens with the immutable subject format:
          #
          #   repo:Foxy@19654159/foxy-inflow@1364910186:ref:refs/heads/main
          #
          # npm's exchange endpoint cannot match that format and rejects it
          # with "404 OIDC token exchange error - package not found" -- the
          # registry's usual mask for an auth failure, not a real 404. See
          # npm/cli#9969. There is no opt-out; the format is permanent for
          # repositories created after that date, so this is npm's to fix.
          # foxy-elements and foxy-sdk predate the cutoff and are unaffected.
          #
          # @semantic-release/npm attempts the exchange first and only reads
          # this token when it fails, so the run log always names the path it
          # took. When a run logs "OIDC token exchange with the npm registry
          # succeeded", npm has shipped the fix: delete this line, then set
          # Publishing access on the package to "require two-factor
          # authentication and disallow bypass 2fa tokens".
          #
          # Until then the token needs rotating every 90 days -- npm's hard cap
          # on granular write tokens. It is an org-level secret, so rotating it
          # affects foxy-elements and foxy-sdk too.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Read the released version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  upload-to-cdn:
    name: Upload to Foxy CDN
    needs: release
    if: ${{ !inputs.dry_run && needs.release.outputs.version != '0.0.0' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build:cdn
      - name: Upload to s3cdn
        uses: Foxy/foxy-github-action-s3cdn@9182acd716c328cd1bdfe21804139e30cd7ff85f
        with:
          package-name: inflow
        env:
          LATEST_TAG_NAME: v${{ needs.release.outputs.version }}
          AWS_S3_CDN_BUCKET_NAME: ${{ secrets.AWS_S3_CDN_BUCKET_NAME }}
          AWS_S3_CDN_KEY_ID: ${{ secrets.AWS_S3_CDN_KEY_ID }}
          AWS_S3_CDN_KEY_SECRET: ${{ secrets.AWS_S3_CDN_KEY_SECRET }}
          SOURCE_DIR: "dist/cdn"
      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_CDN_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_CDN_KEY_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/inflow*"
