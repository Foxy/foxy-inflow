<!DOCTYPE html>
<html lang="en" color-mode="user">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      [data-cloak] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div data-cloak>
      <h1>Sign in</h1>

      <p data-if="portal.isLoggedIn()">You are already logged in. <a href="/">Please visit your portal here.</a></p>

      <form data-if-not="portal.isLoggedIn()" data-v8n="portal.v8n.signIn" data-action="portal.signIn">
        <label>Email:<br /><input name="email" type="email" /></label>
        <label>Password:<br /><input name="password" type="password" /></label>

        <button>
          <span data-if="portal.signIn.isSubmitting">Signing in...</span>
          <span data-if-not="portal.signIn.isSubmitting">Sign in</span>
        </button>
      </form>

      <p data-for="error in portal.signIn.errors" aria-live="polite">
        <span data-text="error.message"></span>
      </p>

      <p><a href="/reset_password">Forgot password?</a> &bull; <a href="/create_account">Create an account</a></p>
    </div>

    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
