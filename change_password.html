<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      [data-cloak] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div data-source="portal.data.customer" data-cloak>
      <h1>Change password</h1>

      <p><a href="/">Return to home page</a></p>
      <p data-if="customer.isLoading">Loading...</p>

      <form
        data-if="customer.isReady"
        data-on-submit="customer.patch"
        novalidate
      >
        <div>
          <label for="password_old">Current password:</label>
          <input
            id="password_old"
            type="password"
            name="password_old"
            required
          />
        </div>

        <div>
          <label for="password_new">New password:</label>
          <input
            id="password_new"
            type="password"
            name="password_new"
            required
          />
        </div>

        <br />

        <button type="submit">Save</button>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
