<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      [data-cloak] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div data-cloak>
      <h1>Create an account</h1>

      <div data-if="portal.data.settings.isLoading">Loading...</div>

      <div data-if="portal.data.settings.isReady">
        <p data-if="portal.isLoggedIn()">You are already logged in. <a href="/">Please visit your portal here.</a></p>

        <form data-if-not="portal.isLoggedIn()" data-v8n="portal.v8n.createAccount" data-action="portal.createAccount">
          <label>First name:<br /><input name="first_name" /></label>
          <label>Last name:<br /><input name="last_name" /></label>
          <label>Email:<br /><input name="email" type="email" /></label>
          <label>Password:<br /><input name="password" type="password" /></label>

          <button>
            <span data-if="portal.createAccount.isSubmitting">Creating your account...</span>
            <span data-if-not="portal.createAccount.isSubmitting">Create an account</span>
          </button>

          <script src="https://cdn.jsdelivr.net/npm/@hcaptcha/vanilla-hcaptcha"></script>
          <h-captcha data-attr-site-key="portal.data.settings.sign_up.verification.site_key"></h-captcha>

          <p>Already have an account? <a href="/sign_in">Sign in</a></p>
        </form>
      </div>
    </div>

    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
