<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inflow Demo</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      [data-cloak] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div data-source="portal.data.settings" data-cloak>
      <div data-if="settings.isLoading">Loading...</div>
      <div data-if="settings.isReady">
        <div data-if="portal.isLoggedIn()">
          <div data-source="portal.data.customer">
            <h1>Profile</h1>

            <p><a href="/">Return to home page</a></p>
            <p data-if="customer.isLoading">Loading...</p>

            <form
              data-if="customer.isReady"
              data-action="customer.patch"
              data-v8n="portal.v8n.customer"
            >
              <div>
                <label for="first_name">First name:</label>
                <input
                  id="first_name"
                  name="first_name"
                  data-ref="firstName"
                  data-value="customer.first_name"
                  required
                />

                <p
                  class="error-message"
                  aria-live="polite"
                  data-if="refs.firstName && refs.firstName.dataset.touched && refs.firstName.validationMessage"
                  data-text="refs.firstName.validationMessage"
                ></p>
              </div>

              <div>
                <label for="last_name">Last name:</label>
                <input
                  id="last_name"
                  name="last_name"
                  data-ref="lastName"
                  data-value="customer.last_name"
                  required
                />

                <p
                  class="error-message"
                  aria-live="polite"
                  data-if="refs.lastName && refs.lastName.dataset.touched && refs.lastName.validationMessage"
                  data-text="refs.lastName.validationMessage"
                ></p>
              </div>

              <div>
                <label for="email">Email:</label>
                <input
                  id="email"
                  type="email"
                  name="email"
                  data-ref="email"
                  data-value="customer.email"
                  required
                />

                <p
                  class="error-message"
                  aria-live="polite"
                  data-if="refs.email && refs.email.dataset.touched && refs.email.validationMessage"
                  data-text="refs.email.validationMessage"
                ></p>
              </div>

              <div>
                <label for="tax_id">Tax ID:</label>
                <input
                  id="tax_id"
                  type="text"
                  name="tax_id"
                  data-ref="taxId"
                  data-value="customer.tax_id"
                />

                <p
                  class="error-message"
                  aria-live="polite"
                  data-if="refs.taxId && refs.taxId.dataset.touched && refs.taxId.validationMessage"
                  data-text="refs.taxId.validationMessage"
                ></p>
              </div>

              <br />
              <button type="submit">Save</button>
            </form>

            <p
              class="error-message"
              aria-live="polite"
              data-for="error in customer.patch.errors"
            >
              <span data-text="error.message"></span>
            </p>
          </div>
        </div>

        <div data-if-not="portal.isLoggedIn()">
          You are logged out. <a href="/sign_in">Sign in here</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@hcaptcha/vanilla-hcaptcha"></script>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
