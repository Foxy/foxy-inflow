<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inflow Demo</title>
    <style>
      [data-cloak] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div data-cloak>
      <h1>Reset password</h1>

      <p data-if="portal.isLoggedIn()">
        You are already logged in.
        <a href="/">Please visit your portal here.</a>
      </p>

      <form
        data-if-not="portal.isLoggedIn()"
        data-v8n="portal.v8n.resetPassword"
        data-action="portal.resetPassword"
      >
        <label
          >Email:<br /><input name="email" type="email" data-ref="email"
        /></label>
        <p
          class="error-message"
          aria-live="polite"
          data-if="refs.email && refs.email.dataset.touched && refs.email.validationMessage"
          data-text="refs.email.validationMessage"
        ></p>

        <button>
          <span data-if="portal.resetPassword.isSubmitting"
            >Resetting your password...</span
          >
          <span data-if-not="portal.resetPassword.isSubmitting"
            >Reset password</span
          >
        </button>
      </form>

      <p data-for="error in portal.resetPassword.errors" aria-live="polite">
        <span data-text="error.message"></span>
      </p>

      <p data-if="portal.resetPassword.isDone" aria-live="polite">
        An email has been sent to the address you provided. Please check your
        inbox and follow the instructions to reset your password.
      </p>

      <p><a href="/sign_in">Return to sign in</a></p>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
