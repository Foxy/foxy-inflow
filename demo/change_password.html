<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inflow Demo</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      [data-cloak] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div data-source="portal.data.customer" data-cloak>
      <h1>Change password</h1>

      <p><a href="/">Return to home page</a></p>
      <p data-if="customer.isLoading">Loading...</p>

      <form
        data-if="customer.isReady"
        data-action="customer.patch"
        data-v8n="portal.v8n.customer"
      >
        <div>
          <label for="password_old">Current password:</label>
          <input
            id="password_old"
            type="password"
            name="password_old"
            data-ref="passwordOld"
            required
          />

          <p
            class="error-message"
            aria-live="polite"
            data-if="refs.passwordOld && refs.passwordOld.dataset.touched && refs.passwordOld.validationMessage"
            data-text="refs.passwordOld.validationMessage"
          ></p>
        </div>

        <div>
          <label for="password">New password:</label>
          <input
            id="password"
            type="password"
            name="password"
            data-ref="password"
            required
          />

          <p
            class="error-message"
            aria-live="polite"
            data-if="refs.password && refs.password.dataset.touched && refs.password.validationMessage"
            data-text="refs.password.validationMessage"
          ></p>
        </div>

        <br />

        <button type="submit">Save</button>
      </form>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
